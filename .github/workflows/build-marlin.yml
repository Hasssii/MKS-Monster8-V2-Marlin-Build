name: Build HASSI Bioprinter MKS Monster8

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your MKS-Monster8 Repo
        uses: actions/checkout@v4
        with:
          repository: Hassii/MKS-Monster8
          path: MKS-Monster8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO (Pinned Working Version)
        run: |
          pip install platformio==6.1.4
          pio --version

      - name: Modify for Bioprinter (200x200, No Temp)
        run: |
          CONFIG_PATH="MKS-Monster8/marlin firmware for voron/MKS_MONSTER_Marlin-2.0.x/Marlin-2.0.x/Marlin"
          cd "$CONFIG_PATH"

          echo "=== Original settings ==="
          grep -n "X_BED_SIZE\|Y_BED_SIZE\|TEMP_SENSOR\|MOTHERBOARD\|PREVENT_COLD\|THERMAL_PROTECTION" Configuration.h | head -20

          # ===== BED SIZE: 200 x 200 =====
          sed -i 's/#define X_BED_SIZE.*/#define X_BED_SIZE 200/' Configuration.h
          sed -i 's/#define Y_BED_SIZE.*/#define Y_BED_SIZE 200/' Configuration.h
          sed -i 's/#define Z_MAX_POS.*/#define Z_MAX_POS 100/' Configuration.h

          # ===== TEMPERATURE: DUMMY for bioprinter =====
          sed -i 's/#define TEMP_SENSOR_0.*/#define TEMP_SENSOR_0 998/' Configuration.h
          sed -i 's/#define TEMP_SENSOR_BED.*/#define TEMP_SENSOR_BED 0/' Configuration.h

          # Disable thermal protection (comment out)
          sed -i 's/^#define THERMAL_PROTECTION_HOTENDS/\/#define THERMAL_PROTECTION_HOTENDS/' Configuration.h
          sed -i 's/^#define THERMAL_PROTECTION_BED/\/#define THERMAL_PROTECTION_BED/' Configuration.h

          # Allow cold extrusion (comment out)
          sed -i 's/^#define PREVENT_COLD_EXTRUSION/\/#define PREVENT_COLD_EXTRUSION/' Configuration.h
          sed -i 's/^#define PREVENT_LENGTHY_EXTRUDE/\/#define PREVENT_LENGTHY_EXTRUDE/' Configuration.h

          echo ""
          echo "=== Modified settings ==="
          grep -n "X_BED_SIZE\|Y_BED_SIZE\|TEMP_SENSOR\|THERMAL_PROTECTION\|PREVENT_COLD" Configuration.h | head -20

      - name: Build Firmware
        run: |
          cd "MKS-Monster8/marlin firmware for voron/MKS_MONSTER_Marlin-2.0.x/Marlin-2.0.x"
          pio run -e mks_monster8

      - name: Verify Binary
        run: |
          BIN_PATH="MKS-Monster8/marlin firmware for voron/MKS_MONSTER_Marlin-2.0.x/Marlin-2.0.x/.pio/build/mks_monster8"
          echo "=== Output files ==="
          ls -lh "$BIN_PATH/"

          BIN_FILE=$(find "$BIN_PATH" -name "*.bin" | head -1)
          if [ -z "$BIN_FILE" ]; then
            echo "❌ No .bin file found!"
            exit 1
          fi

          SIZE=$(stat -c%s "$BIN_FILE")
          echo "Binary: $BIN_FILE"
          echo "Size: $SIZE bytes ($((SIZE/1024)) KB)"

          if [ "$SIZE" -lt 100000 ]; then
            echo "⚠️ WARNING: Binary seems too small!"
            exit 1
          fi

          echo "✅ Build successful!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hassi-bioprinter-firmware
          path: |
            MKS-Monster8/marlin firmware for voron/MKS_MONSTER_Marlin-2.0.x/Marlin-2.0.x/.pio/build/mks_monster8/*.bin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hassi-bio-v${{ github.run_number }}
          name: HASSI Bioprinter Build ${{ github.run_number }}
          body: |
            Automated build for HASSI Bioprinter
            - Board: MKS Monster8 V2
            - Bed: 200x200x100
            - Temperature: Disabled (dummy sensors)
          files: |
            MKS-Monster8/marlin firmware for voron/MKS_MONSTER_Marlin-2.0.x/Marlin-2.0.x/.pio/build/mks_monster8/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
