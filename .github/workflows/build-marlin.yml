name: Build Marlin for MKS Monster8 V2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest Marlin
        uses: actions/checkout@v4
        with:
          repository: MarlinFirmware/Marlin
          ref: bugfix-2.1.x
          path: Marlin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install platformio
          pio upgrade

      - name: Configure for MKS Monster8 V2
        run: |
          cd Marlin/Marlin
          
          # Set the motherboard to MKS Monster8 V2
          sed -i 's/#define MOTHERBOARD.*/#define MOTHERBOARD BOARD_MKS_MONSTER8_V2/' Configuration.h
          
          # Set serial port for USB
          sed -i 's/#define SERIAL_PORT.*/#define SERIAL_PORT -1/' Configuration.h
          
          # Enable EEPROM
          sed -i 's|//#define EEPROM_SETTINGS|#define EEPROM_SETTINGS|' Configuration.h
          
          # Enable SD card support
          sed -i 's|//#define SDSUPPORT|#define SDSUPPORT|' Configuration.h
          
          # Verify changes
          grep "MOTHERBOARD" Configuration.h | head -1
          grep "SERIAL_PORT" Configuration.h | head -1

      - name: Build Firmware
        run: |
          cd Marlin
          pio run -e mks_monster8

      - name: Verify Binary Size
        run: |
          ls -lh Marlin/.pio/build/mks_monster8/
          file Marlin/.pio/build/mks_monster8/mks_monster8.bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mks-monster8-v2-firmware
          path: Marlin/.pio/build/mks_monster8/mks_monster8.bin

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: MKS Monster8 V2 Build ${{ github.run_number }}
          files: Marlin/.pio/build/mks_monster8/mks_monster8.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
