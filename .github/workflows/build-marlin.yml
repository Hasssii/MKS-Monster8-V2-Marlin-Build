name: Build HASSI Bioprinter from MKS Base

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your MKS-Monster8 Repo
        uses: actions/checkout@v4
        with:
          repository: Hassii/MKS-Monster8
          path: MKS-Monster8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install platformio
          pio upgrade

      - name: Modify for Bioprinter (200x200, No Temp)
        run: |
          cd "MKS-Monster8/marlin firmware for voron/MKS_MONSTER_Marlin-2.0.x/Marlin-2.0.x/Marlin"
          
          echo "=== Original settings ==="
          grep -n "X_BED_SIZE\|Y_BED_SIZE\|TEMP_SENSOR\|MOTHERBOARD" Configuration.h | head -10
          
          # ===== BOARD (keep MKS Monster8 V2) =====
          # Already set in MKS config
          
          # ===== BED SIZE: 200 x 200 =====
          sed -i 's/#define X_BED_SIZE.*/#define X_BED_SIZE 200/' Configuration.h
          sed -i 's/#define Y_BED_SIZE.*/#define Y_BED_SIZE 200/' Configuration.h
          sed -i 's/#define Z_MAX_POS.*/#define Z_MAX_POS 100/' Configuration.h
          
          # ===== TEMPERATURE: DUMMY for bioprinter =====
          sed -i 's/#define TEMP_SENSOR_0.*/#define TEMP_SENSOR_0 998/' Configuration.h
          sed -i 's/#define TEMP_SENSOR_BED.*/#define TEMP_SENSOR_BED 0/' Configuration.h
          
          # Disable thermal protection
          sed -i 's/#define THERMAL_PROTECTION_HOTENDS.*/\/\/#define THERMAL_PROTECTION_HOTENDS/' Configuration.h
          sed -i 's/#define THERMAL_PROTECTION_BED.*/\/\/#define THERMAL_PROTECTION_BED/' Configuration.h
          
          # Allow cold extrusion
          sed -i 's/#define PREVENT_COLD_EXTRUSION.*/\/\/#define PREVENT_COLD_EXTRUSION/' Configuration.h
          
          echo ""
          echo "=== Modified settings ==="
          grep -n "X_BED_SIZE\|Y_BED_SIZE\|TEMP_SENSOR\|THERMAL_PROTECTION\|PREVENT_COLD" Configuration.h | head -15

      - name: Build Firmware
        run: |
          cd "MKS-Monster8/marlin firmware for voron/MKS_MONSTER_Marlin-2.0.x/Marlin-2.0.x"
          pio run -e mks_monster8

      - name: Verify Binary Size
        run: |
          echo "=== Output files ==="
          ls -lh "MKS-Monster8/marlin firmware for voron/MKS_MONSTER_Marlin-2.0.x/Marlin-2.0.x/.pio/build/mks_monster8/"
          
          SIZE=$(stat -c%s "MKS-Monster8/marlin firmware for voron/MKS_MONSTER_Marlin-2.0.x/Marlin-2.0.x/.pio/build/mks_monster8/mks_monster8.bin" 2>/dev/null || echo 0)
          echo "Binary size: $SIZE bytes ($((SIZE/1024)) KB)"
          
          if [ "$SIZE" -lt 150000 ]; then
            echo "⚠️ WARNING: Binary seems too small! Expected > 150KB"
            exit 1
          else
            echo "✅ Binary size looks good!"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hassi-bioprinter-firmware
          path: |
            MKS-Monster8/marlin firmware for voron/MKS_MONSTER_Marlin-2.0.x/Marlin-2.0.x/.pio/build/mks_monster8/mks_monster8.bin

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: hassi-bio-${{ github.run_number }}
          name: HASSI Bioprinter Build ${{ github.run_number }}
          files: |
            MKS-Monster8/marlin firmware for voron/MKS_MONSTER_Marlin-2.0.x/Marlin-2.0.x/.pio/build/mks_monster8/mks_monster8.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
