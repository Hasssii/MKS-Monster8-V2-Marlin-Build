name: Build HASSI Bioprinter MKS Monster8 V2

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Marlin 2.1.2.5 Source
        run: |
          wget -q https://github.com/MarlinFirmware/Marlin/archive/refs/tags/2.1.2.5.zip -O marlin.zip
          unzip -q marlin.zip
          mv Marlin-2.1.2.5 Marlin
          echo "✅ Marlin 2.1.2.5 downloaded"

      - name: Set Motherboard and Serial
        run: |
          sed -i 's|.*#define MOTHERBOARD.*|#define MOTHERBOARD BOARD_MKS_MONSTER8_V2|' Marlin/Marlin/Configuration.h
          sed -i 's|.*#define SERIAL_PORT .*|#define SERIAL_PORT 1|' Marlin/Marlin/Configuration.h
          sed -i 's|.*#define SERIAL_PORT_2 .*|#define SERIAL_PORT_2 -1|' Marlin/Marlin/Configuration.h
          echo "=== Verification ==="
          grep -E "MOTHERBOARD|SERIAL_PORT" Marlin/Marlin/Configuration.h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install platformio==6.1.4
          pio --version

      - name: Build Firmware
        run: |
          cd Marlin
          pio run -e mks_monster8

      - name: Verify & Rename Binary
        run: |
          BIN_DIR="Marlin/.pio/build/mks_monster8"

          echo "=== ALL files in build dir ==="
          find "$BIN_DIR" -type f | sort
          echo ""
          echo "=== ALL .bin files with sizes ==="
          find "$BIN_DIR" -name "*.bin" -exec ls -lh {} \;
          echo ""
          echo "=== ALL .elf files with sizes ==="
          find "$BIN_DIR" -name "*.elf" -exec ls -lh {} \;

          # Pick largest .bin file (not the smallest/bootloader)
          BIN_FILE=$(find "$BIN_DIR" -name "*.bin" -exec ls -s {} \; | sort -n | tail -1 | awk '{print $2}')

          if [ -z "$BIN_FILE" ]; then
            echo "❌ No .bin file found!"
            exit 1
          fi

          SIZE=$(ls -lh "$BIN_FILE" | awk '{print $5}')
          echo "✅ Selected binary: $BIN_FILE ($SIZE)"

          # Sanity check — Marlin should be at least 200KB
          SIZE_BYTES=$(stat -c%s "$BIN_FILE")
          if [ "$SIZE_BYTES" -lt 200000 ]; then
            echo "⚠️  WARNING: Binary is only ${SIZE_BYTES} bytes — expected 300KB+"
            echo "This may be a bootloader, not firmware!"
            exit 1
          fi

          cp "$BIN_FILE" "hassi_bioprinter_mks_monster8_v2.bin"
          echo "✅ Binary ready: hassi_bioprinter_mks_monster8_v2.bin ($SIZE)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hassi-bioprinter-firmware
          path: hassi_bioprinter_mks_monster8_v2.bin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bioprinter-v${{ github.run_number }}
          name: HASSI Bioprinter MKS Monster8 V2 - Build ${{ github.run_number }}
          body: |
            **Board:** MKS Monster8 V2
            **Marlin:** 2.1.2.5
            **Serial Port:** 1 (STM32 fix)
          files: hassi_bioprinter_mks_monster8_v2.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
