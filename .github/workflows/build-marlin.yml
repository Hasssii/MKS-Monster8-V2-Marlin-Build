      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO (Pinned)
        run: |
          pip install platformio==6.1.4
          pio --version

      - name: Build Firmware
        run: |
          cd Marlin
          pio run -e mks_monster8

      - name: Verify & Rename Binary
        run: |
          BIN_DIR="Marlin/.pio/build/mks_monster8"
          ls -lh "$BIN_DIR/"
          
          BIN_FILE=$(find "$BIN_DIR" -name "*.bin" | head -1)
          if [ -z "$BIN_FILE" ]; then
            echo "❌ No .bin file found!"
            exit 1
          fi
          
          cp "$BIN_FILE" "hassi_bioprinter_mks_monster8_v2.bin"
          echo "✅ Binary ready: hassi_bioprinter_mks_monster8_v2.bin"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hassi-bioprinter-firmware
          path: hassi_bioprinter_mks_monster8_v2.bin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bioprinter-v${{ github.run_number }}
          name: HASSI Bioprinter MKS Monster8 V2 - Build ${{ github.run_number }}
          body: |
            **Board:** MKS Monster8 V2
            **Bed:** 200x200x100mm
            **Temperature:** Disabled (dummy sensors for bioprinter)
            **Thermal Protection:** Disabled
            **Cold Extrusion:** Disabled
            **Display:** MKS MINI12864 V3 with custom bootscreen
          files: hassi_bioprinter_mks_monster8_v2.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
