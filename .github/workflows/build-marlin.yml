name: Build HASSI Bioprinter Firmware (MKS Monster8 V2)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repo (for _Bootscreen.h)
        uses: actions/checkout@v4
        with:
          path: user-repo

      - name: Checkout Latest Marlin
        uses: actions/checkout@v4
        with:
          repository: MarlinFirmware/Marlin
          ref: bugfix-2.1.x
          path: Marlin

      - name: Copy Custom Bootscreen
        run: |
          cp user-repo/_Bootscreen.h Marlin/Marlin/_Bootscreen.h
          echo "✅ Custom HASSI bootscreen copied"
          ls -la Marlin/Marlin/_Bootscreen.h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install platformio
          pio upgrade

      - name: Configure for HASSI Bioprinter
        run: |
          cd Marlin/Marlin
          
          echo "=== BEFORE: Current settings ==="
          grep -n "MOTHERBOARD\|TEMP_SENSOR\|X_BED_SIZE\|Y_BED_SIZE" Configuration.h | head -10
          
          # ===== BOARD & SERIAL =====
          sed -i 's/^[[:space:]]*#define MOTHERBOARD.*/#define MOTHERBOARD BOARD_MKS_MONSTER8_V2/' Configuration.h
          sed -i 's/^[[:space:]]*#define SERIAL_PORT.*/#define SERIAL_PORT -1/' Configuration.h
          sed -i 's/^[[:space:]]*\/\/#define SERIAL_PORT_2.*/#define SERIAL_PORT_2 1/' Configuration.h
          
          # ===== PRINTER TYPE (Cartesian for bioprinter) =====
          # Keep Cartesian - no COREXY for standard bioprinter
          
          # ===== BED SIZE: 200 x 200 =====
          sed -i 's/^[[:space:]]*#define X_BED_SIZE.*/#define X_BED_SIZE 200/' Configuration.h
          sed -i 's/^[[:space:]]*#define Y_BED_SIZE.*/#define Y_BED_SIZE 200/' Configuration.h
          sed -i 's/^[[:space:]]*#define Z_MAX_POS.*/#define Z_MAX_POS 100/' Configuration.h
          
          # ===== EXTRUDER =====
          sed -i 's/^[[:space:]]*#define EXTRUDERS.*/#define EXTRUDERS 1/' Configuration.h
          
          # ===== TEMPERATURE: DISABLED for bioprinter =====
          # Use dummy thermistor 998 (always reads 25°C) to bypass thermal checks
          sed -i 's/^[[:space:]]*#define TEMP_SENSOR_0.*/#define TEMP_SENSOR_0 998/' Configuration.h
          sed -i 's/^[[:space:]]*#define TEMP_SENSOR_BED.*/#define TEMP_SENSOR_BED 0/' Configuration.h
          
          # Disable thermal runaway protection (no heaters to protect)
          sed -i 's/^[[:space:]]*#define THERMAL_PROTECTION_HOTENDS.*/\/\/#define THERMAL_PROTECTION_HOTENDS/' Configuration.h
          sed -i 's/^[[:space:]]*#define THERMAL_PROTECTION_BED.*/\/\/#define THERMAL_PROTECTION_BED/' Configuration.h
          
          # Allow cold extrusion (no temp checking)
          sed -i 's/^[[:space:]]*#define PREVENT_COLD_EXTRUSION.*/\/\/#define PREVENT_COLD_EXTRUSION/' Configuration.h
          sed -i 's/^[[:space:]]*#define EXTRUDE_MINTEMP.*/\/\/#define EXTRUDE_MINTEMP/' Configuration.h
          
          # ===== HEATER LIMITS (dummy values since no real heaters) =====
          sed -i 's/^[[:space:]]*#define HEATER_0_MAXTEMP.*/#define HEATER_0_MAXTEMP 30/' Configuration.h
          sed -i 's/^[[:space:]]*#define BED_MAXTEMP.*/#define BED_MAXTEMP 30/' Configuration.h
          
          # ===== STEPPER DRIVERS (TMC2209) =====
          sed -i 's/^[[:space:]]*\/\/#define X_DRIVER_TYPE.*/#define X_DRIVER_TYPE TMC2209/' Configuration.h
          sed -i 's/^[[:space:]]*\/\/#define Y_DRIVER_TYPE.*/#define Y_DRIVER_TYPE TMC2209/' Configuration.h
          sed -i 's/^[[:space:]]*\/\/#define Z_DRIVER_TYPE.*/#define Z_DRIVER_TYPE TMC2209/' Configuration.h
          sed -i 's/^[[:space:]]*\/\/#define E0_DRIVER_TYPE.*/#define E0_DRIVER_TYPE TMC2209/' Configuration.h
          
          # ===== ENDSTOPS =====
          sed -i 's/^[[:space:]]*\/\/#define USE_XMIN_PLUG/#define USE_XMIN_PLUG/' Configuration.h
          sed -i 's/^[[:space:]]*\/\/#define USE_YMIN_PLUG/#define USE_YMIN_PLUG/' Configuration.h
          sed -i 's/^[[:space:]]*\/\/#define USE_ZMIN_PLUG/#define USE_ZMIN_PLUG/' Configuration.h
          
          # ===== EEPROM & SD CARD =====
          sed -i 's/^[[:space:]]*\/\/#define EEPROM_SETTINGS/#define EEPROM_SETTINGS/' Configuration.h
          sed -i 's/^[[:space:]]*\/\/#define SDSUPPORT/#define SDSUPPORT/' Configuration.h
          
          # ===== LCD (MKS MINI12864 V3) - ENABLED for testing =====
          sed -i 's/^[[:space:]]*\/\/#define MKS_MINI_12864_V3/#define MKS_MINI_12864_V3/' Configuration.h
          
          # ===== BOOTSCREEN (HASSI custom logo) =====
          # SHOW_BOOTSCREEN is usually enabled by default
          sed -i 's/^[[:space:]]*\/\/#define SHOW_BOOTSCREEN/#define SHOW_BOOTSCREEN/' Configuration.h
          
          echo ""
          echo "=== AFTER: Bioprinter settings ==="
          grep -n "MOTHERBOARD\|TEMP_SENSOR\|X_BED_SIZE\|Y_BED_SIZE\|THERMAL_PROTECTION\|PREVENT_COLD_EXTRUSION" Configuration.h | head -15

      - name: Configure Advanced Settings
        run: |
          cd Marlin/Marlin
          
          # ===== HOST SUPPORT (Pronterface/OctoPrint) =====
          sed -i 's/^[[:space:]]*\/\/#define HOST_ACTION_COMMANDS/#define HOST_ACTION_COMMANDS/' Configuration_adv.h
          sed -i 's/^[[:space:]]*\/\/#define HOST_PROMPT_SUPPORT/#define HOST_PROMPT_SUPPORT/' Configuration_adv.h
          
          echo "=== Advanced config verified ==="
          grep "HOST_ACTION_COMMANDS\|HOST_PROMPT_SUPPORT" Configuration_adv.h | grep -v "//" | head -5

      - name: Build Firmware
        run: |
          cd Marlin
          pio run -e mks_monster8_usb_flash_drive

      - name: Verify Binary
        run: |
          echo "=== Output files ==="
          ls -lh Marlin/.pio/build/mks_monster8_usb_flash_drive/
          
          echo "=== Binary details ==="
          file Marlin/.pio/build/mks_monster8_usb_flash_drive/mks_monster8.bin || true
          file Marlin/.pio/build/mks_monster8_usb_flash_drive/firmware.bin || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hassi-bioprinter-firmware
          path: |
            Marlin/.pio/build/mks_monster8_usb_flash_drive/mks_monster8.bin
            Marlin/.pio/build/mks_monster8_usb_flash_drive/firmware.bin

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: hassi-bio-${{ github.run_number }}
          name: HASSI Bioprinter Build ${{ github.run_number }}
          files: |
            Marlin/.pio/build/mks_monster8_usb_flash_drive/mks_monster8.bin
            Marlin/.pio/build/mks_monster8_usb_flash_drive/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
