name: Build HASSI Bioprinter MKS Monster8 V2

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Marlin 2.1.2.5 Source
        run: |
          wget -q https://github.com/MarlinFirmware/Marlin/archive/refs/tags/2.1.2.5.zip -O marlin.zip
          unzip -q marlin.zip
          mv Marlin-2.1.2.5 Marlin
          echo "✅ Marlin 2.1.2.5 downloaded"

      - name: Apply Bioprinter Patches
        run: |
          cd Marlin/Marlin

          # ── Board & Serial ──────────────────────────────────────────
          sed -i 's|.*#define MOTHERBOARD.*|#define MOTHERBOARD BOARD_MKS_MONSTER8_V2|' Configuration.h
          sed -i 's|.*#define SERIAL_PORT .*|#define SERIAL_PORT 1|' Configuration.h
          sed -i 's|.*#define SERIAL_PORT_2 .*|#define SERIAL_PORT_2 -1|' Configuration.h

          # ── Bed Size 200x200x200 ────────────────────────────────────
          sed -i 's|.*#define X_BED_SIZE.*|#define X_BED_SIZE 200|' Configuration.h
          sed -i 's|.*#define Y_BED_SIZE.*|#define Y_BED_SIZE 200|' Configuration.h
          sed -i 's|.*#define Z_MAX_POS.*|#define Z_MAX_POS 200|' Configuration.h

          # ── Disable ALL Temperature Sensors ────────────────────────
          # 998 = dummy sensor, always reports 25°C so Marlin won't complain
          sed -i 's|.*#define TEMP_SENSOR_0 .*|#define TEMP_SENSOR_0 998|' Configuration.h
          sed -i 's|.*#define TEMP_SENSOR_1 .*|#define TEMP_SENSOR_1 0|' Configuration.h
          sed -i 's|.*#define TEMP_SENSOR_2 .*|#define TEMP_SENSOR_2 0|' Configuration.h
          sed -i 's|.*#define TEMP_SENSOR_3 .*|#define TEMP_SENSOR_3 0|' Configuration.h
          sed -i 's|.*#define TEMP_SENSOR_4 .*|#define TEMP_SENSOR_4 0|' Configuration.h
          sed -i 's|.*#define TEMP_SENSOR_BED .*|#define TEMP_SENSOR_BED 0|' Configuration.h
          sed -i 's|.*#define TEMP_SENSOR_PROBE .*|#define TEMP_SENSOR_PROBE 0|' Configuration.h
          sed -i 's|.*#define TEMP_SENSOR_CHAMBER .*|#define TEMP_SENSOR_CHAMBER 0|' Configuration.h
          sed -i 's|.*#define TEMP_SENSOR_COOLER .*|#define TEMP_SENSOR_COOLER 0|' Configuration.h

          # ── Disable Thermal Protection ──────────────────────────────
          sed -i 's|.*#define THERMAL_PROTECTION_HOTENDS.*|//#define THERMAL_PROTECTION_HOTENDS|' Configuration_adv.h
          sed -i 's|.*#define THERMAL_PROTECTION_BED.*|//#define THERMAL_PROTECTION_BED|' Configuration_adv.h
          sed -i 's|.*#define THERMAL_PROTECTION_CHAMBER.*|//#define THERMAL_PROTECTION_CHAMBER|' Configuration_adv.h
          sed -i 's|.*#define THERMAL_PROTECTION_COOLER.*|//#define THERMAL_PROTECTION_COOLER|' Configuration_adv.h

          # ── Disable PID (no heaters needed) ────────────────────────
          sed -i '/^[[:space:]]*#define PIDTEMP[^_]/s|#define|//#define|' Configuration.h
          sed -i '/^[[:space:]]*#define PIDTEMPBED/s|#define|//#define|' Configuration.h

          # ── Syringe Pump — disable cold extrusion checks ───────────
          # Syringe has no heat so we must allow extrusion at any temp
          sed -i 's|.*#define PREVENT_COLD_EXTRUSION.*|//#define PREVENT_COLD_EXTRUSION|' Configuration.h
          sed -i 's|.*#define PREVENT_LENGTHY_EXTRUDE.*|//#define PREVENT_LENGTHY_EXTRUDE|' Configuration.h

          # ── Syringe Pump — extruder steps/mm ───────────────────────
          # Default 93 steps/mm is for filament — syringe needs higher value
          # 837 steps/mm is a common starting point for syringe, tune later
          sed -i 's|.*#define DEFAULT_AXIS_STEPS_PER_UNIT.*|#define DEFAULT_AXIS_STEPS_PER_UNIT { 80, 80, 400, 837 }|' Configuration.h

          # ── Syringe Pump — allow long extrusions ───────────────────
          sed -i 's|.*#define EXTRUDE_MAXLENGTH.*|#define EXTRUDE_MAXLENGTH 500|' Configuration_adv.h

          echo "=== Verification ==="
          echo "--- Configuration.h ---"
          grep -E "MOTHERBOARD|SERIAL_PORT|BED_SIZE|Z_MAX_POS|TEMP_SENSOR_0|TEMP_SENSOR_BED|PREVENT_COLD|PIDTEMP|STEPS_PER_UNIT" Configuration.h
          echo "--- Configuration_adv.h ---"
          grep -E "THERMAL_PROTECTION|EXTRUDE_MAXLENGTH" Configuration_adv.h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install platformio==6.1.4
          pio --version

      - name: Build Firmware
        run: |
          cd Marlin
          pio run -e mks_monster8

      - name: Convert ELF to BIN
        run: |
          BIN_DIR="Marlin/.pio/build/mks_monster8"
          ELF_FILE="$BIN_DIR/firmware.elf"

          if [ ! -f "$ELF_FILE" ]; then
            echo "❌ firmware.elf not found!"
            exit 1
          fi

          echo "✅ Found firmware.elf ($(ls -lh $ELF_FILE | awk '{print $5}'))"

          sudo apt-get install -y -q gcc-arm-none-eabi
          arm-none-eabi-objcopy -O binary "$ELF_FILE" "hassi_bioprinter_mks_monster8_v2.bin"

          echo "✅ Binary: $(ls -lh hassi_bioprinter_mks_monster8_v2.bin | awk '{print $5}')"
          arm-none-eabi-size "$ELF_FILE"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hassi-bioprinter-firmware
          path: hassi_bioprinter_mks_monster8_v2.bin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bioprinter-v${{ github.run_number }}
          name: HASSI Bioprinter MKS Monster8 V2 - Build ${{ github.run_number }}
          body: |
            **Board:** MKS Monster8 V2
            **Marlin:** 2.1.2.5
            **Bed:** 200 x 200 x 200 mm
            **Extruder:** Syringe pump (steps/mm: 837 — tune as needed)
            **Temperature:** All sensors disabled (dummy 998)
            **Thermal Protection:** Disabled
            **Cold Extrusion:** Disabled
            **PID:** Disabled
            **Max Extrude Length:** 500mm
          files: hassi_bioprinter_mks_monster8_v2.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
