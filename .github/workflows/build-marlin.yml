name: Build HASSI Bioprinter MKS Monster8 V2

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Marlin 2.1.2.5 Source
        run: |
          wget -q https://github.com/MarlinFirmware/Marlin/archive/refs/tags/2.1.2.5.zip -O marlin.zip
          unzip -q marlin.zip
          mv Marlin-2.1.2.5 Marlin
          echo "✅ Marlin 2.1.2.5 downloaded"

      - name: Set Motherboard and Serial
        run: |
          sed -i 's|.*#define MOTHERBOARD.*|#define MOTHERBOARD BOARD_MKS_MONSTER8_V2|' Marlin/Marlin/Configuration.h
          sed -i 's|.*#define SERIAL_PORT .*|#define SERIAL_PORT 1|' Marlin/Marlin/Configuration.h
          sed -i 's|.*#define SERIAL_PORT_2 .*|#define SERIAL_PORT_2 -1|' Marlin/Marlin/Configuration.h
          echo "=== Verification ==="
          grep -E "MOTHERBOARD|SERIAL_PORT" Marlin/Marlin/Configuration.h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install platformio==6.1.4
          pio --version

      - name: Build Firmware
        run: |
          cd Marlin
          pio run -e mks_monster8

      - name: Convert ELF to BIN
        run: |
          BIN_DIR="Marlin/.pio/build/mks_monster8"
          ELF_FILE="$BIN_DIR/firmware.elf"

          echo "=== All build files ==="
          find "$BIN_DIR" -maxdepth 1 -type f | sort
          echo ""

          if [ ! -f "$ELF_FILE" ]; then
            echo "❌ firmware.elf not found!"
            exit 1
          fi

          ELF_SIZE=$(ls -lh "$ELF_FILE" | awk '{print $5}')
          echo "✅ Found firmware.elf ($ELF_SIZE)"

          # Install ARM toolchain
          sudo apt-get install -y -q gcc-arm-none-eabi

          # Convert ELF to BIN
          arm-none-eabi-objcopy -O binary "$ELF_FILE" "hassi_bioprinter_mks_monster8_v2.bin"

          FINAL_SIZE=$(ls -lh "hassi_bioprinter_mks_monster8_v2.bin" | awk '{print $5}')
          echo "✅ Converted to binary: $FINAL_SIZE"

          # Sanity check
          SIZE_BYTES=$(stat -c%s "hassi_bioprinter_mks_monster8_v2.bin")
          if [ "$SIZE_BYTES" -lt 200000 ]; then
            echo "⚠️ WARNING: Still only ${SIZE_BYTES} bytes — something may be wrong"
            exit 1
          fi

          echo "✅ Binary looks good: ${SIZE_BYTES} bytes"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hassi-bioprinter-firmware
          path: hassi_bioprinter_mks_monster8_v2.bin

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bioprinter-v${{ github.run_number }}
          name: HASSI Bioprinter MKS Monster8 V2 - Build ${{ github.run_number }}
          body: |
            **Board:** MKS Monster8 V2
            **Marlin:** 2.1.2.5
            **Serial Port:** 1 (STM32 fix)
          files: hassi_bioprinter_mks_monster8_v2.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
